onboarding = false

[theme]
name = "terminal"

[ui.toast]
delivery = "herdr"

[ui.sound.agents]
github_copilot = "off"
pi = "off"

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["terminal_title_stripped"],
  ["agent"],
]

[ui.sidebar.agents.rows_by_agent]
copilot = [
  ["state_icon", "terminal_title_stripped"],
  ["workspace", "tab"],
]
pi = [
  ["state_icon", "terminal_title_stripped"],
  ["workspace", "tab"],
]

[keys]
prefix = "ctrl+space"
